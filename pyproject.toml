# pyproject.toml

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridshape"
version = "0.1.1"
dynamic = ["keywords", "maintainers"]
license = "GPL-3.0-or-later"  # SPDX ID

authors = [
    { name="Mehmet Keçeci", email="enfo@tuta.io" },
]
description = "gridshape: A Python module for drawing geometric shapes on a cell matrix with high‑resolution subgrid support, statistical analysis and visualisation."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-mock", "ruff", "numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/WhiteSymmetry/gridshape"
Repository = "https://github.com/WhiteSymmetry/gridshape"

[dependency-groups]
build = [
    "setuptools (>=82.0.1)",
    "cython (>=3.2.4)"
]
