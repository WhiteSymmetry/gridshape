{% set version = "0.1.1" %}

package:
  name: gridshape
  version: {{ version }}

source:
  path: .  # Derlemeyi bu meta.yaml dosyasının bulunduğu dizinden yap
  url: 
  blake2b-256: 

channels:
  - conda-forge

build:
  noarch: python  # Platformdan bağımsız bir paket oluşturur
  #script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed"
  script: "{{ PYTHON }} -m pip install . -vv"
  number: 0
  entry_points:
    - gridshape = gridshape.__main__:main

requirements:
  host:
    - python {{ python }}
    - numpy
    - setuptools
    # Other build tools
  run:
    - python >=3.11
    - numpy
    # Other runtime dependencies
  build:
    - python >=3.11
    - pip
    - setuptools
    - numpy

test:
  requires:
    - numpy
  imports:
    - numpy

about:
  home: https://github.com/WhiteSymmetry/gridshape
  license: AGPL-3.0-or-later
  summary: 'gridshape: A Python module for drawing geometric shapes on a cell matrix with high‑resolution subgrid support, statistical analysis and visualisation.'
  description: |
    gridshape: A Python module for drawing geometric shapes on a cell matrix with high‑resolution subgrid support, statistical analysis and visualisation.
  dev_url: https://github.com/WhiteSymmetry/gridshape
  doc_url: https://github.com/WhiteSymmetry/gridshape
  doc_source_url: https://github.com/WhiteSymmetry/gridshape/blob/main/README.md
