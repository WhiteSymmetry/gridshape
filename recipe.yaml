# recipe.yaml
schema_version: 1

# this sets up "context variables" (in this case name and version) that
# can later be used in Jinja expressions
context:
  version: 0.1.2
  name: gridshape

# top level package information (name and version)
package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

# the requirements at build and runtime
requirements:
  host:
    - python >=3.11
    - pip
    - hatchling >=1.28.0
    - setuptools
    - wheel
  run:
   - python >=3.11  # hypercomplex uyumlu versiyon
   - numpy  # gridshape numpy kullanıyor
   - requests >=2.32.0
   - matplotlib >=3.7.0

# tests to validate that the package works as expected
#tests:
#  requires: []  # veya boş liste
#  - python:
#      imports:
#        - gridshape
tests:
  - python:
      imports:
        - gridshape
      pip_check: true
  - script:
      - python -c "import gridshape; print(gridshape.__version__)"
      - python -c "import numpy, requests, matplotlib"

# information about the package
about:
  homepage: https://github.com/WhiteSymmetry/gridshape/
  license: AGPL-3.0-or-later
  summary: 'gridshape'
  description: |
    gridshape
  repository: https://github.com/WhiteSymmetry/gridshape/
  documentation: https://github.com/WhiteSymmetry/gridshape/

# the below is conda-forge specific!
extra:
  recipe-maintainers:
    - bilgi
